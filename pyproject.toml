[project]
name = "financial-analytics_coursework-1"
version = "1.0.0"
description = "Сервис для анализа финансовых транзакций"
authors = [{name = "NataliaKozlova",email = "natamedoed22@gmail.com"}]
requires-python = ">=3.14"
dependencies = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=1.20.0,<2.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "excel (>=1.0.1,<2.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "pandas-stubs (>=3.0.0.260204,<4.0.0.0)",
    "types-requests (>=2.33.0.20260402,<3.0.0.0)",

]

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
  | \.venv
  | \.idea
  | __pycache__
)/
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
tests = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
